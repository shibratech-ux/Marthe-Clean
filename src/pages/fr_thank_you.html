        <!-- Boîte de dialogue -->
            <div id="dialog" style="
                display:none;
                position: fixed;
                top: 55%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0.9);
                width: 65vw;              
                max-width: 450px;         
                background: #fff;
                padding: 18px;            
                border-radius: 15px;
                box-shadow: 0 6px 16px rgba(128, 128, 128, 0.5);
                z-index: 1000;
                text-align: left;
                opacity: 0;
                transition: all 0.3s ease-in-out;
                font-family: Arial, sans-serif;
                font-size: 13px;          
            ">

                <!-- Icône Cancel (X) -->
                <span id="closeDialog" style="
                    position: absolute;
                    top: 10px;
                    right: 15px;
                    font-size: 16px;
                    font-weight: bold;
                    color: #555;
                    cursor: pointer;
                ">✖</span>

                <h4 style="font-size:14px;">📄 Entrez le numéro de référence</h4>
                <p id="aktenzeichen" style="margin: 3px 0;">🆔 Aktenzeichen : </p>
                <p style="margin: 3px 0;">⏰ Stunde : 2 Stunde</p>
                <p style="margin: 3px 0;">🧹 Service : Umzug Reinigung</p>
                <p style="margin: 3px 0;">💰 Price : 10000 CHF</p>

                <!-- Formulaire -->
                <form id="transactionForm" style="margin-top:12px;">
                    <label for="transactionNumber" style="display:block; margin-top:8px; font-size:13px;">💳 Numéro de transaction : ✅</label>
                    <input type="text" id="transactionNumber" name="transactionNumber" placeholder="Entrez le numéro de transaction" required style="
                        width: 100%;
                        padding: 3px;
                        margin-top: 3px;
                        border-radius: 6px;
                        border: 1px solid #ccc;
                        box-sizing: border-box;
                        font-size: 18px;
                    ">

                    <div style="text-align:center; margin-top:15px;">
                        <img src="./assets/images/qrcode.jpeg" alt="media" style="
                            width: 100%;
                            height: 200px;
                            object-fit: cover;
                        ">
                    </div>

                    <div style="text-align:center;">
                        <button id="submitButton" type="submit" style="
                            padding: 6px 14px;
                            background: #BB8B48;
                            color: #fff;
                            font-size: 18px;
                            font-weight: bold;
                            border: none;
                            border-radius: 6px;
                            cursor: pointer;
                            transition: background 0.3s ease;
                        ">Confirmer</button>
                    </div>
                </form>
            </div>

            <script type="module" src="./src/scripts/pages/fr_thank_you-2.js"></script>
