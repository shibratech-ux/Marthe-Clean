    <div class="karx-service-area pb-120 pt-120" data-background="./assets/img/services/pattern-bg1.png">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-10">
                    <div class="karx-online-form-wrapper wow fadeInUp" data-wow-delay=".1s">
                        <div class="karx-online-form-header">
                            <h4 class="online-form-header-title">Online-Kostenvoranschlag anfordern</h4>
                            <span></span>
                        </div>
                        <div class="karx-online-form-body">
                            <form id="formRequest">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" placeholder="Name" required>

                                <label for="email">E-Mail</label>
                                <input type="email" id="email" name="email" placeholder="E-Mail" required>

                                <label for="phone">Handynummer</label>
                                <input type="tel" id="phone" name="phone" placeholder="Handynummer" required>

                                <label for="address">Adresse</label>
                                <input type="text" id="address" name="address" placeholder="Adresse" required>

                                <label for="info">Zusätzliche Informationen</label>
                                <textarea id="info" name="info" placeholder="Zusätzliche Informationen"></textarea>

                                <label for="serviceType">Dienstleistung</label>
                                <select id="serviceType" name="serviceType" required>
                                    <option value="">Dienstleistung auswählen</option>
                                    <option value="Normalreinigung">Normalreinigung</option>
                                    <option value="Spezialreinigung">Spezialreinigung</option>
                                    <option value="Umzugsreinigung">Umzugsreinigung</option>
                                </select>

                                <label for="hours">Benötigte Stunden</label>
                                <select id="hours" name="hours" required>
                                    <option value="">Stunden auswählen</option>
                                    <option value="1">1 Stunde</option>
                                    <option value="2">2 Stunden</option>
                                    <option value="3">3 Stunden</option>
                                    <option value="4">4 Stunden</option>
                                    <option value="5">5 Stunden</option>
                                    <option value="6">6 Stunden</option>
                                    <option value="7">7 Stunden</option>
                                    <option value="8">8 Stunden</option>
                                </select>

                                <label for="finalPriceDisplay">Geschätzter Preis</label>
                                <input type="text" id="finalPriceDisplay" value="CHF 0" readonly>
                                <input type="hidden" id="finalPriceValue" name="finalPrice" value="0">

                                <label for="apartments">Wie viele Wohnungen möchten Sie reinigen lassen?</label>
                                <input type="number" id="apartments" name="apartments"
                                    placeholder="Anzahl der Wohnungen" min="1">

                                <button type="submit" id="requestSubmit">Anfrage absenden <i
                                        class="fas fa-long-arrow-right"></i></button>
                                <div id="requestFeedback"></div>
                            </form>
                        </div>
