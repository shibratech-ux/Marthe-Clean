                        </div>

                                    <input type="text" id="name" placeholder="Nom complet" required>
                                    <div class="error-message" id="error-name">Veuillez entrer votre nom</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="email" id="email" placeholder="Adresse email" required>
                                    <div class="error-message" id="error-email">Veuillez entrer un email valide</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="tel" id="phone" placeholder="Téléphone" required>
                                    <div class="error-message" id="error-phone">Veuillez entrer votre numéro</div>
                                </div>
                                <div class="col-12 mb-3">
                                    <textarea id="message" placeholder="Message" required></textarea>
                                    <div class="error-message" id="error-message">Veuillez entrer un message</div>
                                </div>
                                <div class="col-12">
                                    <button id="submitBtn" type="submit">Envoyer <i class="fas fa-angle-double-right"></i></button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
