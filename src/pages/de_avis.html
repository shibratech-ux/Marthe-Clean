<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avis Client – Démo</title>
  <!-- TailwindCSS CDN (dev) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./src/scripts/pages/de_avis-1.js"></script>
  <link rel="stylesheet" href="./src/styles/pages/de_avis-1.css">
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    <!-- include:header-a4f6640ae31a.html -->

    <!-- Carte résumé -->
    <section class="grid gap-4 sm:grid-cols-2 mb-8">
      <div class="bg-white rounded-2xl shadow p-6 flex items-center gap-6">
        <div>
          <div id="averageRating" class="text-4xl font-extrabold">0.0</div>
          <div class="text-sm text-gray-500">Note moyenne / 5</div>
          <div class="mt-2" id="averageStars" aria-hidden="true"></div>
        </div>
        <div class="grow">
          <!-- Répartition -->
          <ul id="distribution" class="space-y-2"></ul>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="font-semibold text-lg mb-4">Laisser un avis</h2>
        <form id="reviewForm" class="space-y-4" novalidate>
          <div>
            <label for="name" class="block text-sm font-medium mb-1">Nom <span class="text-gray-400">(optionnel)</span></label>
            <input id="name" name="name" type="text" placeholder="Ex: Marie K."
                   class="w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-brand-500" maxlength="60" />
          </div>

          <fieldset>
            <legend class="block text-sm font-medium mb-1">Votre note <span class="text-red-500">*</span></legend>
            <div id="rating" class="flex items-center gap-1" role="radiogroup" aria-label="Note sur 5">
              <!-- Les étoiles interactives seront injectées par JS -->
            </div>
            <p id="ratingHelp" class="text-xs text-gray-500 mt-1">Utilisez la souris ou les flèches gauche/droite puis Espace pour sélectionner.</p>
          </fieldset>

          <div>
            <label for="title" class="block text-sm font-medium mb-1">Titre de l'avis <span class="text-gray-400">(optionnel)</span></label>
            <input id="title" name="title" type="text" placeholder="Ex: Super expérience !"
                   class="w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-brand-500" maxlength="80" />
          </div>

          <div>
            <label for="comment" class="block text-sm font-medium mb-1">Commentaire <span class="text-red-500">*</span></label>
            <textarea id="comment" name="comment" rows="4" placeholder="Dites-nous ce que vous avez aimé ou à améliorer..."
                      class="w-full rounded-xl border border-gray-300 px-3 py-2 focus:border-brand-500" maxlength="600" required></textarea>
            <div class="flex justify-between text-xs text-gray-500 mt-1">
              <span>Max 600 caractères</span>
              <span id="charCount">0/600</span>
            </div>
          </div>

          <div class="flex items-start gap-2">
            <input id="consent" type="checkbox" class="mt-1 h-4 w-4 rounded border-gray-300" />
            <label for="consent" class="text-sm text-gray-700">J'accepte que mon avis soit affiché publiquement sur ce site.</label>
          </div>

          <div class="flex items-center gap-3">
            <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2 disabled:opacity-50 disabled:cursor-not-allowed">Publier</button>
            <button type="button" id="resetBtn" class="text-sm text-gray-600 hover:text-gray-900">Réinitialiser les données</button>
          </div>
          <p id="formError" class="text-sm text-red-600 hidden"></p>
          <p id="formSuccess" class="text-sm text-green-600 hidden">Merci ! Votre avis a été publié.</p>
        </form>
      </div>
    </section>

    <!-- Liste des avis -->
    <section class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-lg">Tous les avis</h2>
        <div class="flex items-center gap-2 text-sm">
          <label for="sortBy" class="text-gray-600">Trier :</label>
          <select id="sortBy" class="rounded-lg border border-gray-300 px-2 py-1">
            <option value="newest">Plus récents</option>
            <option value="oldest">Plus anciens</option>
            <option value="highest">Meilleure note</option>
            <option value="lowest">Moins bonne note</option>
          </select>
        </div>
      </div>

      <ul id="reviews" class="divide-y divide-gray-100"></ul>

      <template id="reviewItemTpl">
        <li class="py-4">
          <div class="flex items-start gap-3">
            <div class="shrink-0 h-10 w-10 rounded-full bg-brand-100 flex items-center justify-center font-semibold text-brand-700"></div>
            <div class="grow min-w-0">
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                <div class="font-medium"></div>
                <div class="text-xs text-gray-500"></div>
              </div>
              <div class="mt-1" aria-hidden="true"></div>
              <div class="mt-1 font-semibold"></div>
              <p class="mt-1 text-gray-700"></p>
            </div>
            <div class="text-xs text-gray-500 whitespace-nowrap"></div>
          </div>
        </li>
      </template>
    </section>

  </main>

  <script src="./src/scripts/pages/de_avis-2.js"></script>
</body>
</html>
