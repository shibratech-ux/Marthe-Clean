    <!-- Formulaire de devis -->
    <div class="karx-service-area pb-120 pt-120" data-background="./assets/img/services/pattern-bg1.png">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-10">
                    <div class="karx-online-form-wrapper wow fadeInUp" data-wow-delay=".1s">
                        <div class="karx-online-form-header">
                            <h4 class="online-form-header-title">Request an online quote</h4>
                            <span></span>
                        </div>
                        <div class="karx-online-form-body">
                            <form id="formRequest">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" placeholder="Name" required>

                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="Email" required>

                                <label for="phone">Phone number</label>
                                <input type="tel" id="phone" name="phone" placeholder="Phone number" required>

                                <label for="address">Address</label>
                                <input type="text" id="address" name="address" placeholder="Address" required>

                                <label for="info">Additional information</label>
                                <textarea id="info" name="info" placeholder="Additional information"></textarea>

                                <label for="serviceType">Desired service</label>
                                <select id="serviceType" name="serviceType" required>
                                    <option value="">Choose a service</option>
                                    <option value="Normalreinigung">Standard cleaning</option>
                                    <option value="Spezialreinigung">Specialized cleaning</option>
                                    <option value="Umzugsreinigung">Move-out cleaning</option>
                                </select>

                                <label for="hours">Number of hours needed</label>
                                <select id="hours" name="hours" required>
                                    <option value="">Choose number of hours</option>
                                    <option value="1">1 hour</option>
                                    <option value="2">2 hours</option>
                                    <option value="3">3 hours</option>
                                    <option value="4">4 hours</option>
                                    <option value="5">5 hours</option>
                                    <option value="6">6 hours</option>
                                    <option value="7">7 hours</option>
                                    <option value="8">8 hours</option>
                                </select>

                                <label for="finalPriceDisplay">Estimated price</label>
                                <input type="text" id="finalPriceDisplay" value="CHF 0" readonly>
                                <input type="hidden" id="finalPriceValue" name="finalPrice" value="0">

                                <label for="apartments">How many apartments do you want cleaned?</label>
                                <input type="number" id="apartments" name="apartments" placeholder="Number of apartments"
                                    min="1">

                                <button type="submit" id="requestSubmit">Submit request <i
                                        class="fas fa-long-arrow-right"></i></button>
                                <div id="requestFeedback"></div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-10">
                    <img src="/assets/img/blog/blog-img-3.jpg" alt="" class="img-fluid">
                    <div id="serviceLandingDetails" class="mt-4" style="display: none;">
                        <p id="serviceLandingDescription" class="mb-2"></p>
                        <p id="serviceLandingPrice" class="fw-bold mb-0"></p>
                    </div>
